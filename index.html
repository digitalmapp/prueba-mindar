<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1,
    user-scalable=no, viewport-fit=cover"
  >

  <title>Rolling AR Experience</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box !important;
    }

    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background: #000 !important;
      touch-action: none;
    }

    body {
      position: fixed !important;
      inset: 0 !important;
      width: 100dvw !important;
      height: 100dvh !important;
    }

    a-scene,
    .a-scene,
    canvas,
    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100dvw !important;
      height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
    }

    video {
      position: fixed !important;
      inset: 0 !important;
      width: 100dvw !important;
      height: 100dvh !important;
      min-width: 100dvw !important;
      min-height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: cover !important;
      object-position: center center !important;
    }

    /* MENSAJE TEMPORAL */

    #hint {
      position: fixed;
      z-index: 10000;
      left: 50%;
      bottom: calc(30px + env(safe-area-inset-bottom));
      transform: translateX(-50%);

      padding: 9px 17px;
      border-radius: 999px;

      background: rgba(0,0,0,.58);
      backdrop-filter: blur(8px);

      color: white;

      font-family: Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;

      letter-spacing: .2px;

      opacity: 0;
      transition: opacity .35s ease;

      pointer-events: none;
      white-space: nowrap;
    }

    /* DESTELLO LOCAL */

    #burst {
      position: fixed;
      z-index: 9998;

      left: 50%;
      top: 50%;

      width: 170px;
      height: 170px;

      transform: translate(-50%, -50%) scale(.2);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,.80) 0%,
          rgba(255,255,255,.30) 14%,
          rgba(255,40,40,.18) 32%,
          rgba(255,0,0,0) 70%
        );

      opacity: 0;
      pointer-events: none;
    }

    #burst.play {
      animation: burst .75s ease-out forwards;
    }

    @keyframes burst {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.15);
      }

      20% {
        opacity: .9;
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2.4);
      }
    }

    /* CAPA DE INTERACCIÓN TÁCTIL */

    #touchLayer {
      position: fixed;
      inset: 0;
      z-index: 9000;

      background: transparent;

      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    /* PARTÍCULAS */

    #particles {
      position: fixed;
      z-index: 9999;

      left: 50%;
      top: 50%;

      width: 1px;
      height: 1px;

      pointer-events: none;
    }

    .particle {
      position: absolute;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: white;

      opacity: 0;

      box-shadow:
        0 0 8px rgba(255,255,255,.85),
        0 0 14px rgba(255,40,40,.45);
    }

    .particle.play {
      animation: particleFly .7s ease-out forwards;
    }

    @keyframes particleFly {
      0% {
        opacity: 0;
        transform: translate(0,0) scale(.3);
      }

      15% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform:
          translate(var(--x), var(--y))
          scale(.1);
      }
    }
  </style>


  <script>

    AFRAME.registerComponent("rolling-experience", {

      init: function () {

        const target = this.el;

        const entrance = document.querySelector("#entrance");

        const mouth = document.querySelector("#mouthLayer");
        const border = document.querySelector("#borderLayer");
        const teeth = document.querySelector("#teethLayer");
        const lips = document.querySelector("#lipsLayer");
        const tongue = document.querySelector("#tongueLayer");

        const hint = document.querySelector("#hint");
        const burst = document.querySelector("#burst");
        const particles = document.querySelectorAll(".particle");

        const touchLayer = document.querySelector("#touchLayer");

        let visible = false;
        let reacting = false;

        let hintTimer1;
        let hintTimer2;

        let touchStartX = 0;
        let touchStartY = 0;
        let dragging = false;
        let activePointerId = null;
        let hasTapped = false;


        /* =========================================
           UTILIDADES
        ========================================= */

        const removeAnimations = () => {

          [
            entrance,
            mouth,
            border,
            teeth,
            lips,
            tongue

          ].forEach(el => {

            const attrs = el.getAttributeNames();

            attrs.forEach(attr => {

              if (attr.startsWith("animation__")) {
                el.removeAttribute(attr);
              }

            });

          });

        };


        const resetLayers = () => {

          removeAnimations();

          entrance.setAttribute(
            "position",
            "-0.02 -0.08 0.005"
          );

          entrance.setAttribute(
            "rotation",
            "0 0 -7"
          );

          entrance.setAttribute(
            "scale",
            "0.12 0.12 0.12"
          );


          mouth.setAttribute(
            "position",
            "0 0 0"
          );

          border.setAttribute(
            "position",
            "0 0 0.004"
          );

          teeth.setAttribute(
            "position",
            "0 0 0.009"
          );

          lips.setAttribute(
            "position",
            "0 0 0.017"
          );

          tongue.setAttribute(
            "position",
            "0 -0.006 0.032"
          );


          tongue.setAttribute(
            "rotation",
            "0 0 0"
          );

          tongue.setAttribute(
            "scale",
            "1 1 1"
          );

          reacting = false;
          dragging = false;
          activePointerId = null;

        };


        /* =========================================
           GUÍA DE USUARIO (HINT EN DOS ETAPAS)
        ========================================= */

        const showHint = (text, holdMs) => {

          clearTimeout(hintTimer2);

          hint.textContent = text;
          hint.style.opacity = "1";

          hintTimer2 = setTimeout(() => {

            hint.style.opacity = "0";

          }, holdMs);

        };


        /* =========================================
           EFECTO DE APARICIÓN
        ========================================= */

        const playBurst = () => {

          burst.classList.remove("play");

          void burst.offsetWidth;

          burst.classList.add("play");


          particles.forEach((particle, index) => {

            const angle =
              (Math.PI * 2 / particles.length) * index;

            const distance =
              65 + Math.random() * 60;

            const x =
              Math.cos(angle) * distance;

            const y =
              Math.sin(angle) * distance;


            particle.style.setProperty(
              "--x",
              `${x}px`
            );

            particle.style.setProperty(
              "--y",
              `${y}px`
            );


            particle.classList.remove("play");

            void particle.offsetWidth;

            particle.classList.add("play");

          });

        };


        /* =========================================
           RESPIRACIÓN / VIDA
        ========================================= */

        const startIdle = () => {

          if (!visible || reacting) return;


          tongue.setAttribute(
            "animation__breathe",
            {
              property: "scale",

              from: "1 1 1",
              to: "1.035 1.035 1.035",

              dur: 1500,

              dir: "alternate",
              loop: true,

              easing: "easeInOutSine"
            }
          );


          tongue.setAttribute(
            "animation__float",
            {
              property: "position",

              from: "0 -0.009 0.032",
              to: "0 0.003 0.045",

              dur: 1750,

              dir: "alternate",
              loop: true,

              easing: "easeInOutSine"
            }
          );


          lips.setAttribute(
            "animation__lipfloat",
            {
              property: "position",

              from: "0 -0.002 0.017",
              to: "0 0.003 0.022",

              dur: 2100,

              dir: "alternate",
              loop: true,

              easing: "easeInOutSine"
            }
          );

        };


        /* =========================================
           TARGET ENCONTRADO
        ========================================= */

        target.addEventListener(
          "targetFound",
          () => {

            visible = true;
            hasTapped = false;

            clearTimeout(hintTimer1);
            clearTimeout(hintTimer2);

            resetLayers();


            /*
              Entrada general.
              Nace dentro del cuadro.
            */

            entrance.setAttribute(
              "animation__scale",
              {
                property: "scale",

                from: "0.12 0.12 0.12",
                to: "0.52 0.52 0.52",

                dur: 950,

                easing: "easeOutBack"
              }
            );


            entrance.setAttribute(
              "animation__forward",
              {
                property: "position",

                from: "-0.02 -0.08 0.005",
                to: "-0.02 -0.03 0.105",

                dur: 1050,

                easing: "easeOutCubic"
              }
            );


            entrance.setAttribute(
              "animation__rotate",
              {
                property: "rotation",

                from: "0 0 -7",
                to: "0 0 0",

                dur: 1000,

                easing: "easeOutBack"
              }
            );


            /*
              PARALLAX.

              Cada capa avanza una cantidad
              ligeramente diferente.
            */

            mouth.setAttribute(
              "animation__depth",
              {
                property: "position",
                from: "0 0 0",
                to: "0 0 0",
                dur: 800,
                easing: "easeOutCubic"
              }
            );


            border.setAttribute(
              "animation__depth",
              {
                property: "position",
                from: "0 0 0",
                to: "0 0 0.006",
                dur: 820,
                easing: "easeOutCubic"
              }
            );


            teeth.setAttribute(
              "animation__depth",
              {
                property: "position",
                from: "0 0 0",
                to: "0 0 0.014",
                dur: 860,
                easing: "easeOutCubic"
              }
            );


            lips.setAttribute(
              "animation__depth",
              {
                property: "position",
                from: "0 0 0",
                to: "0 0 0.024",
                dur: 920,
                easing: "easeOutCubic"
              }
            );


            tongue.setAttribute(
              "animation__depth",
              {
                property: "position",

                from: "0 -0.03 0",
                to: "0 -0.006 0.040",

                dur: 1050,

                easing: "easeOutBack"
              }
            );


            tongue.setAttribute(
              "animation__tongueScale",
              {
                property: "scale",

                from: ".76 .76 .76",
                to: "1 1 1",

                dur: 1000,

                easing: "easeOutBack"
              }
            );


            /*
              Flash/partículas justo cuando
              termina de desprenderse.
            */

            setTimeout(() => {

              if (!visible) return;

              playBurst();

            }, 560);


            /*
              Empieza el movimiento orgánico.
            */

            setTimeout(() => {

              if (!visible) return;

              startIdle();

            }, 1150);


            /*
              Instrucción inicial: "Tocá la lengua".
              Si el usuario ya hizo tap antes de que
              se cumpla el timer, no se pisa el hint
              de swipe.
            */

            hintTimer1 = setTimeout(() => {

              if (visible && !hasTapped) {
                showHint("Tocá la lengua", 2600);
              }

            }, 1250);

          }
        );


        /* =========================================
           TARGET PERDIDO
        ========================================= */

        target.addEventListener(
          "targetLost",
          () => {

            visible = false;
            hasTapped = false;

            clearTimeout(hintTimer1);
            clearTimeout(hintTimer2);

            hint.style.opacity = "0";

            resetLayers();

          }
        );


        /* =========================================
           LIMPIEZA DE ANIMACIONES EN CONFLICTO

           #entrance acumula instancias del
           componente animation apuntando a scale/
           position/rotation: las de la entrada
           inicial (ya terminadas) y las de ciclos
           previos de TAP/SWIPE. Se eliminan todas
           antes de iniciar una nueva reacción para
           que no escriban simultáneamente sobre la
           misma propiedad.
        ========================================= */

        const clearEntranceMotion = () => {

          [
            "animation__scale",
            "animation__forward",
            "animation__rotate",

            "animation__tapScale1",
            "animation__tapPos1",
            "animation__tapRot1",
            "animation__tapScale2",
            "animation__tapPos2",
            "animation__tapRot2",

            "animation__swipeRot1",
            "animation__swipePos1",
            "animation__swipeRot2",
            "animation__swipePos2"

          ].forEach(attr => {

            entrance.removeAttribute(attr);

          });

        };


        /* =========================================
           TOQUE: IMPULSO DEL CONJUNTO (#entrance)

           Todo el grupo (boca, borde, dientes,
           labios y lengua) reacciona como una sola
           pieza cohesionada. La lengua solo tiene
           un acompañamiento secundario mínimo para
           que no parezca que se despega del resto.
        ========================================= */

        const punch = () => {

          if (!visible || reacting) return;

          reacting = true;

          clearEntranceMotion();


          if (!hasTapped) {

            hasTapped = true;

            showHint("Deslizá para moverla", 2200);

          }


          tongue.removeAttribute(
            "animation__breathe"
          );

          tongue.removeAttribute(
            "animation__float"
          );


          entrance.setAttribute(
            "animation__tapScale1",
            {
              property: "scale",

              from: "0.52 0.52 0.52",
              to: "0.66 0.66 0.66",

              dur: 200,

              easing: "easeOutCubic"
            }
          );


          entrance.setAttribute(
            "animation__tapPos1",
            {
              property: "position",

              from: "-0.02 -0.03 0.105",
              to: "-0.02 -0.015 0.17",

              dur: 200,

              easing: "easeOutCubic"
            }
          );


          entrance.setAttribute(
            "animation__tapRot1",
            {
              property: "rotation",

              from: "0 0 0",
              to: "6 6 -6",

              dur: 200,

              easing: "easeOutCubic"
            }
          );


          tongue.setAttribute(
            "animation__tapTongue1",
            {
              property: "scale",

              from: "1 1 1",
              to: "1.08 1.08 1.08",

              dur: 200,

              easing: "easeOutCubic"
            }
          );


          setTimeout(() => {

            entrance.setAttribute(
              "animation__tapScale2",
              {
                property: "scale",

                from: "0.66 0.66 0.66",
                to: "0.52 0.52 0.52",

                dur: 480,

                easing: "easeOutBack"
              }
            );


            entrance.setAttribute(
              "animation__tapPos2",
              {
                property: "position",

                from: "-0.02 -0.015 0.17",
                to: "-0.02 -0.03 0.105",

                dur: 480,

                easing: "easeOutBack"
              }
            );


            entrance.setAttribute(
              "animation__tapRot2",
              {
                property: "rotation",

                from: "6 6 -6",
                to: "0 0 0",

                dur: 480,

                easing: "easeOutBack"
              }
            );


            tongue.setAttribute(
              "animation__tapTongue2",
              {
                property: "scale",

                from: "1.08 1.08 1.08",
                to: "1 1 1",

                dur: 480,

                easing: "easeOutBack"
              }
            );

          }, 200);


          setTimeout(() => {

            reacting = false;

            if (visible) {
              startIdle();
            }

          }, 700);

        };


        /* =========================================
           SWIPE HORIZONTAL DEL CONJUNTO (#entrance)

           El grupo completo se inclina y se
           desplaza levemente en la dirección del
           gesto, y vuelve elástico al centro. La
           lengua solo suma un parallax mínimo,
           sin separarse del resto de las capas.
        ========================================= */

        const swipe = (direction) => {

          if (!visible || reacting) return;

          reacting = true;

          clearEntranceMotion();


          tongue.removeAttribute(
            "animation__breathe"
          );

          tongue.removeAttribute(
            "animation__float"
          );


          const side =
            direction > 0 ? 1 : -1;


          entrance.setAttribute(
            "animation__swipeRot1",
            {
              property: "rotation",

              from: "0 0 0",

              to:
                `0 ${side * 24} ${side * -16}`,

              dur: 210,

              easing: "easeOutCubic"
            }
          );


          entrance.setAttribute(
            "animation__swipePos1",
            {
              property: "position",

              from: "-0.02 -0.03 0.105",

              to:
                `${-0.02 + side * 0.075} -0.03 0.115`,

              dur: 210,

              easing: "easeOutCubic"
            }
          );


          tongue.setAttribute(
            "animation__swipeTongue1",
            {
              property: "position",

              from: "0 -0.006 0.032",

              to:
                `${side * 0.014} -0.006 0.032`,

              dur: 210,

              easing: "easeOutCubic"
            }
          );


          setTimeout(() => {

            entrance.setAttribute(
              "animation__swipeRot2",
              {
                property: "rotation",

                to: "0 0 0",

                dur: 540,

                easing: "easeOutElastic"
              }
            );


            entrance.setAttribute(
              "animation__swipePos2",
              {
                property: "position",

                to: "-0.02 -0.03 0.105",

                dur: 540,

                easing: "easeOutElastic"
              }
            );


            tongue.setAttribute(
              "animation__swipeTongue2",
              {
                property: "position",

                to: "0 -0.006 0.032",

                dur: 460,

                easing: "easeOutBack"
              }
            );

          }, 220);


          setTimeout(() => {

            reacting = false;

            if (visible) {
              startIdle();
            }

          }, 780);

        };


        /* =========================================
           INTERACCIÓN MÓVIL

           Se usa una capa dedicada (#touchLayer)
           con Pointer Events en lugar de depender
           del canvas de MindAR/A-Frame o de click,
           porque en Android/Chrome el video y los
           overlays de UI de MindAR pueden quedar
           por encima del canvas y absorber el toque
           antes de que llegue a un listener puesto
           directamente sobre él.
        ========================================= */

        if (touchLayer) {

          touchLayer.addEventListener(
            "pointerdown",
            event => {

              if (!visible) return;

              if (activePointerId !== null) return;

              activePointerId = event.pointerId;

              touchStartX = event.clientX;
              touchStartY = event.clientY;

              dragging = false;


              if (touchLayer.setPointerCapture) {

                try {

                  touchLayer.setPointerCapture(
                    event.pointerId
                  );

                } catch (e) {}

              }

            },

            { passive: true }
          );


          touchLayer.addEventListener(
            "pointermove",
            event => {

              if (!visible) return;

              if (event.pointerId !== activePointerId) return;


              const dx =
                event.clientX - touchStartX;

              const dy =
                event.clientY - touchStartY;


              if (
                Math.abs(dx) > 12 ||
                Math.abs(dy) > 12
              ) {

                dragging = true;

              }

            },

            { passive: true }
          );


          const endGesture = event => {

            if (event.pointerId !== activePointerId) return;

            activePointerId = null;

            if (!visible) return;


            const dx =
              event.clientX - touchStartX;

            const dy =
              event.clientY - touchStartY;


            /*
              Swipe horizontal claro.
            */

            if (
              Math.abs(dx) > 45 &&
              Math.abs(dx) >
              Math.abs(dy) * 1.3
            ) {

              swipe(dx);

              return;
            }


            /*
              Si prácticamente no se movió,
              lo consideramos toque.
            */

            if (
              Math.abs(dx) < 18 &&
              Math.abs(dy) < 18
            ) {

              punch();

            }

          };


          touchLayer.addEventListener(
            "pointerup",
            endGesture,
            { passive: true }
          );


          touchLayer.addEventListener(
            "pointercancel",
            endGesture,
            { passive: true }
          );

        }

      }

    });

  </script>
</head>


<body>

  <div id="burst"></div>

  <div id="particles">

    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>

  </div>


  <div id="hint">
    Tocá la lengua
  </div>


  <div id="touchLayer"></div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiScanning: yes;
      uiLoading: yes;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true;
      antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded

  >


    <a-assets>

      <img id="boca" src="./boca.png">
      <img id="borde" src="./borde.png">
      <img id="dientes" src="./dientes.png">
      <img id="labios" src="./labios.png">
      <img id="lengua" src="./LENGUA.png">

    </a-assets>


    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    >
    </a-camera>


    <a-entity
      mindar-image-target="targetIndex: 0"
      rolling-experience
    >


      <a-entity
        id="entrance"

        position="-0.02 -0.08 0.005"

        rotation="0 0 -7"

        scale="0.12 0.12 0.12"
      >


        <!-- BOCA / CAPA TRASERA -->

        <a-image
          id="mouthLayer"

          src="#boca"

          position="0 0 0"

          width="1"
          height="1"

          material="
            transparent: true;
            alphaTest: 0.01;
            side: double;
          "
        >
        </a-image>


        <!-- BORDE -->

        <a-image
          id="borderLayer"

          src="#borde"

          position="0 0 0.004"

          width="1"
          height="1"

          material="
            transparent: true;
            alphaTest: 0.01;
            side: double;
          "
        >
        </a-image>


        <!-- DIENTES -->

        <a-image
          id="teethLayer"

          src="#dientes"

          position="0 0 0.009"

          width="1"
          height="1"

          material="
            transparent: true;
            alphaTest: 0.01;
            side: double;
          "
        >
        </a-image>


        <!-- LABIOS -->

        <a-image
          id="lipsLayer"

          src="#labios"

          position="0 0 0.017"

          width="1"
          height="1"

          material="
            transparent: true;
            alphaTest: 0.01;
            side: double;
          "
        >
        </a-image>


        <!-- LENGUA PRINCIPAL -->

        <a-image
          id="tongueLayer"

          src="#lengua"

          position="0 -0.006 0.032"

          width="1"
          height="1"

          material="
            transparent: true;
            alphaTest: 0.01;
            side: double;
