<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Prueba MindAR 2.5D</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <!-- =========================
         IMÁGENES
    ========================== -->

    <a-assets>

      <img
        id="boca"
        src="./boca.png"
        crossorigin="anonymous"
      >

      <img
        id="borde"
        src="./borde.png"
        crossorigin="anonymous"
      >

      <img
        id="dientes"
        src="./dientes.png"
        crossorigin="anonymous"
      >

      <img
        id="labios"
        src="./labios.png"
        crossorigin="anonymous"
      >

      <img
        id="lengua"
        src="./LENGUA.png"
        crossorigin="anonymous"
      >

    </a-assets>


    <!-- =========================
         CÁMARA
    ========================== -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>


    <!-- =========================
         TARGET
    ========================== -->

    <a-entity mindar-image-target="targetIndex: 0">


      <!-- CAPA 1 - BOCA / FONDO -->

      <a-image
        src="#boca"
        position="0 0 0"
        width="1"
        height="1"
        material="
          transparent: true;
          alphaTest: 0.01;
          side: double
        "
      ></a-image>


      <!-- CAPA 2 - BORDE -->

      <a-image
        src="#borde"
        position="0 0 0.015"
        width="1"
        height="1"
        material="
          transparent: true;
          alphaTest: 0.01;
          side: double
        "
      ></a-image>


      <!-- CAPA 3 - DIENTES -->

      <a-image
        src="#dientes"
        position="0 0 0.030"
        width="1"
        height="1"
        material="
          transparent: true;
          alphaTest: 0.01;
          side: double
        "
      ></a-image>


      <!-- CAPA 4 - LABIOS -->

      <a-image
        src="#labios"
        position="0 0 0.045"
        width="1"
        height="1"
        material="
          transparent: true;
          alphaTest: 0.01;
          side: double
        "
      ></a-image>


      <!-- CAPA 5 - LENGUA
           Es la que más sobresale -->

      <a-image
        src="#lengua"
        position="0 -0.01 0.075"
        width="1"
        height="1"
        material="
          transparent: true;
          alphaTest: 0.01;
          side: double
        "
      ></a-image>


    </a-entity>

  </a-scene>

</body>
</html>
