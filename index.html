<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1,
    user-scalable=no, viewport-fit=cover"
  >

  <title>MindAR - Rolling 2.5D</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box !important;
    }

    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background: #000 !important;
      touch-action: none;
    }

    body {
      position: fixed !important;
      inset: 0 !important;
      width: 100dvw !important;
      height: 100dvh !important;
    }

    a-scene,
    .a-scene,
    canvas,
    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100dvw !important;
      height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
    }

    video {
      position: fixed !important;
      inset: 0 !important;
      width: 100dvw !important;
      height: 100dvh !important;
      min-width: 100dvw !important;
      min-height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: cover !important;
      object-position: center center !important;
    }

    #hint {
      position: fixed;
      z-index: 10000;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom));
      transform: translateX(-50%);

      padding: 10px 18px;
      border-radius: 999px;

      background: rgba(0,0,0,.62);
      color: white;

      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;

      opacity: 0;
      transition: opacity .35s ease;

      pointer-events: none;
    }
  </style>

  <script>

    AFRAME.registerComponent("rolling-experience", {

      init: function () {

        const target = this.el;

        const entrance = document.querySelector("#entrance");
        const floating = document.querySelector("#floating");
        const logoHit = document.querySelector("#logoHit");
        const hint = document.querySelector("#hint");

        const scene = document.querySelector("a-scene");

        let visible = false;
        let reacting = false;
        let hintTimer1;
        let hintTimer2;


        /* -------------------------
           RESET
        -------------------------- */

        const reset = () => {

          entrance.removeAttribute("animation__scale");
          entrance.removeAttribute("animation__forward");
          entrance.removeAttribute("animation__rotate");

          floating.removeAttribute("animation__float");
          floating.removeAttribute("animation__touch1");
          floating.removeAttribute("animation__touch2");
          floating.removeAttribute("animation__touchrot1");
          floating.removeAttribute("animation__touchrot2");

          entrance.setAttribute("scale", "0.12 0.12 0.12");

          /*
            Arranca aproximadamente desde
            el centro del logo impreso.
          */

          entrance.setAttribute(
            "position",
            "-0.02 -0.08 0.005"
          );

          entrance.setAttribute(
            "rotation",
            "0 0 -6"
          );

          floating.setAttribute(
            "position",
            "0 0 0"
          );

          floating.setAttribute(
            "rotation",
            "0 0 0"
          );

          reacting = false;
        };


        /* -------------------------
           TARGET ENCONTRADO
        -------------------------- */

        target.addEventListener("targetFound", () => {

          visible = true;

          clearTimeout(hintTimer1);
          clearTimeout(hintTimer2);

          reset();


          /*
            CRECE DESDE EL CUADRO
          */

          entrance.setAttribute("animation__scale", {

            property: "scale",

            from: "0.12 0.12 0.12",
            to: "0.52 0.52 0.52",

            dur: 900,

            easing: "easeOutBack"

          });


          /*
            SE DESPRENDE HACIA ADELANTE
          */

          entrance.setAttribute("animation__forward", {

            property: "position",

            from: "-0.02 -0.08 0.005",
            to: "-0.02 -0.03 0.105",

            dur: 1000,

            easing: "easeOutCubic"

          });


          /*
            ENDEREZA EL LOGO
          */

          entrance.setAttribute("animation__rotate", {

            property: "rotation",

            from: "0 0 -6",
            to: "0 0 0",

            dur: 1000,

            easing: "easeOutBack"

          });


          /*
            FLOTACIÓN SUAVE
          */

          setTimeout(() => {

            if (!visible) return;

            floating.setAttribute("animation__float", {

              property: "position",

              from: "0 -0.008 0",
              to: "0 0.012 0.014",

              dur: 1700,

              dir: "alternate",
              loop: true,

              easing: "easeInOutSine"

            });

          }, 1100);


          /*
            MENSAJE TEMPORAL
          */

          hintTimer1 = setTimeout(() => {

            if (visible) {
              hint.style.opacity = "1";
            }

          }, 1200);


          hintTimer2 = setTimeout(() => {

            hint.style.opacity = "0";

          }, 3800);

        });


        /* -------------------------
           TARGET PERDIDO
        -------------------------- */

        target.addEventListener("targetLost", () => {

          visible = false;

          clearTimeout(hintTimer1);
          clearTimeout(hintTimer2);

          hint.style.opacity = "0";

          reset();

        });


        /* -------------------------
           FUNCIÓN DE REACCIÓN
        -------------------------- */

        const react = () => {

          if (!visible || reacting) return;

          reacting = true;

          floating.removeAttribute("animation__float");

          floating.removeAttribute("animation__touch1");
          floating.removeAttribute("animation__touch2");

          floating.removeAttribute("animation__touchrot1");
          floating.removeAttribute("animation__touchrot2");


          /*
            SALTA HACIA LA CÁMARA
          */

          floating.setAttribute("animation__touch1", {

            property: "position",

            from: "0 0 0.01",
            to: "0 0.015 0.20",

            dur: 230,

            easing: "easeOutCubic"

          });


          /*
            Y GIRA
          */

          floating.setAttribute("animation__touchrot1", {

            property: "rotation",

            from: "0 0 0",
            to: "-8 10 7",

            dur: 230,

            easing: "easeOutCubic"

          });


          /*
            VUELVE
          */

          setTimeout(() => {

            floating.setAttribute("animation__touch2", {

              property: "position",

              from: "0 0.015 0.20",
              to: "0 0 0",

              dur: 420,

              easing: "easeOutBack"

            });


            floating.setAttribute("animation__touchrot2", {

              property: "rotation",

              from: "-8 10 7",
              to: "0 0 0",

              dur: 420,

              easing: "easeOutBack"

            });

          }, 240);


          /*
            VUELVE A FLOTAR
          */

          setTimeout(() => {

            if (visible) {

              floating.setAttribute("animation__float", {

                property: "position",

                from: "0 -0.008 0",
                to: "0 0.012 0.014",

                dur: 1700,

                dir: "alternate",
                loop: true,

                easing: "easeInOutSine"

              });

            }

            reacting = false;

          }, 720);

        };


        /* -------------------------
           TOUCH REAL DEL CELULAR
        -------------------------- */

        scene.addEventListener("loaded", () => {

          const canvas = scene.canvas;

          if (!canvas) return;


          canvas.addEventListener(
            "touchend",
            (event) => {

              if (!visible) return;

              event.preventDefault();

              const touch = event.changedTouches[0];

              if (!touch) return;


              /*
                Calculamos dónde tocó
                dentro de la pantalla.
              */

              const rect = canvas.getBoundingClientRect();

              const mouse = new THREE.Vector2();

              mouse.x =
                ((touch.clientX - rect.left) / rect.width) * 2 - 1;

              mouse.y =
                -((touch.clientY - rect.top) / rect.height) * 2 + 1;


              /*
                Lanzamos un rayo desde la cámara.
              */

              const camera = scene.camera;

              const raycaster = new THREE.Raycaster();

              raycaster.setFromCamera(mouse, camera);


              /*
                Comprobamos si tocó el área del logo.
              */

              const object =
                logoHit.getObject3D("mesh");

              if (!object) return;


              const intersections =
                raycaster.intersectObject(object, true);


              if (intersections.length > 0) {

                react();

              }

            },

            { passive: false }

          );

        });

      }

    });

  </script>

</head>


<body>

  <div id="hint">
    Tocá la lengua
  </div>


  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiScanning: yes;
      uiLoading: yes;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true;
      antialias: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded

  >


    <a-assets>

      <img id="boca" src="./boca.png">
      <img id="borde" src="./borde.png">
      <img id="dientes" src="./dientes.png">
      <img id="labios" src="./labios.png">
      <img id="lengua" src="./LENGUA.png">

    </a-assets>


    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    >
    </a-camera>


    <a-entity
      mindar-image-target="targetIndex: 0"
      rolling-experience
    >


      <a-entity
        id="entrance"

        position="-0.02 -0.08 0.005"

        rotation="0 0 -6"

        scale="0.12 0.12 0.12"
      >


        <a-entity id="floating">


          <!-- BOCA -->

          <a-image
            src="#boca"

            position="0 0 0"

            width="1"
            height="1"

            material="
              transparent: true;
              alphaTest: 0.01;
              side: double;
            "
          >
          </a-image>


          <!-- BORDE -->

          <a-image
            src="#borde"

            position="0 0 0.004"

            width="1"
            height="1"

            material="
              transparent: true;
              alphaTest: 0.01;
              side: double;
            "
          >
          </a-image>


          <!-- DIENTES -->

          <a-image
            src="#dientes"

            position="0 0 0.008"

            width="1"
            height="1"

            material="
              transparent: true;
              alphaTest: 0.01;
              side: double;
            "
          >
          </a-image>


          <!-- LABIOS -->

          <a-image
            src="#labios"

            position="0 0 0.013"

            width="1"
            height="1"

            material="
              transparent: true;
              alphaTest: 0.01;
              side: double;
            "
          >
          </a-image>


          <!-- LENGUA -->

          <a-image
            src="#lengua"

            position="0 -0.006 0.022"

            width="1"
            height="1"

            material="
              transparent: true;
              alphaTest: 0.01;
              side: double;
            "
          >
          </a-image>


          <!--
            ÁREA INVISIBLE PARA DETECTAR EL TOQUE.
            Es ligeramente grande para que en móvil
            no tengas que acertar exactamente.
          -->

          <a-plane
            id="logoHit"

            position="0 0 0.04"

            width="1.08"
            height="1.08"

            material="
              transparent: true;
              opacity: 0;
              side: double;
            "
          >
          </a-plane>


        </a-entity>

      </a-entity>


    </a-entity>

  </a-scene>

</body>
</html>
