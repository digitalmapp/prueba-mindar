<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <title>MindAR - Rolling 2.5D</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box !important;
    }

    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background: #000 !important;
    }

    body {
      position: fixed !important;
      inset: 0 !important;
      width: 100dvw !important;
      height: 100dvh !important;
    }

    a-scene,
    .a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100dvw !important;
      height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      overflow: hidden !important;
    }

    canvas,
    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100dvw !important;
      height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
    }

    video {
      position: fixed !important;
      inset: 0 !important;
      width: 100dvw !important;
      height: 100dvh !important;
      min-width: 100dvw !important;
      min-height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: cover !important;
      object-position: center center !important;
      margin: 0 !important;
      padding: 0 !important;
    }
  </style>

  <script>
    AFRAME.registerComponent("rolling-effect", {

      init: function () {

        const target = this.el;
        const logo = document.querySelector("#rollingLogo");
        const tongue = document.querySelector("#tongueLayer");

        target.addEventListener("targetFound", () => {

          /* LOGO:
             aparece pequeño y crece claramente
          */

          logo.removeAttribute("animation__scale");
          logo.removeAttribute("animation__forward");
          tongue.removeAttribute("animation__tongue");

          logo.setAttribute("scale", "0.20 0.20 0.20");
          logo.setAttribute("position", "-0.20 0.10 0");

          tongue.setAttribute("position", "0 0 0.05");

          logo.setAttribute("animation__scale", {
            property: "scale",
            from: "0.20 0.20 0.20",
            to: "0.82 0.82 0.82",
            dur: 1100,
            easing: "easeOutElastic"
          });

          /* TODO EL LOGO SALE DEL CUADRO */

          logo.setAttribute("animation__forward", {
            property: "position",
            from: "-0.20 0.10 0",
            to: "-0.20 0.10 0.18",
            dur: 900,
            easing: "easeOutCubic"
          });

          /* LA LENGUA SOBRESALE MÁS */

          tongue.setAttribute("animation__tongue", {
            property: "position",
            from: "0 0 0.05",
            to: "0 -0.015 0.22",
            dur: 1000,
            delay: 250,
            easing: "easeOutBack"
          });

        });


        target.addEventListener("targetLost", () => {

          logo.removeAttribute("animation__scale");
          logo.removeAttribute("animation__forward");
          tongue.removeAttribute("animation__tongue");

          logo.setAttribute("scale", "0.20 0.20 0.20");
          logo.setAttribute("position", "-0.20 0.10 0");

          tongue.setAttribute("position", "0 0 0.05");

        });

      }

    });
  </script>

</head>


<body>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiScanning: yes;
      uiLoading: yes;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true;
      antialias: true;
    "

    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-assets>

      <img id="boca" src="./boca.png">

      <img id="borde" src="./borde.png">

      <img id="dientes" src="./dientes.png">

      <img id="labios" src="./labios.png">

      <img id="lengua" src="./LENGUA.png">

    </a-assets>


    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    >
    </a-camera>


    <a-entity
      mindar-image-target="targetIndex: 0"
      rolling-effect
    >

      <a-entity
        id="rollingLogo"
        position="-0.20 0.10 0"
        scale="0.20 0.20 0.20"
      >

        <!-- FONDO / BOCA -->

        <a-image
          src="#boca"
          position="0 0 0"
          width="1"
          height="1"
          material="
            transparent: true;
            alphaTest: 0.01;
            side: double;
          "
        >
        </a-image>


        <!-- BORDE -->

        <a-image
          src="#borde"
          position="0 0 0.025"
          width="1"
          height="1"
          material="
            transparent: true;
            alphaTest: 0.01;
            side: double;
          "
        >
        </a-image>


        <!-- DIENTES -->

        <a-image
          src="#dientes"
          position="0 0 0.055"
          width="1"
          height="1"
          material="
            transparent: true;
            alphaTest: 0.01;
            side: double;
          "
        >
        </a-image>


        <!-- LABIOS -->

        <a-image
          src="#labios"
          position="0 0 0.09"
          width="1"
          height="1"
          material="
            transparent: true;
            alphaTest: 0.01;
            side: double;
          "
        >
        </a-image>


        <!-- LENGUA -->

        <a-image
          id="tongueLayer"
          src="#lengua"
          position="0 0 0.05"
          width="1"
          height="1"
          material="
            transparent: true;
            alphaTest: 0.01;
            side: double;
          "
        >
        </a-image>

      </a-entity>

    </a-entity>

  </a-scene>

</body>
</html>
