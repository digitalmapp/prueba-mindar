<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <title>MindAR - Rolling 2.5D</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box !important;
    }

    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background: #000 !important;
    }

    body {
      position: fixed !important;
      inset: 0 !important;
      width: 100dvw !important;
      height: 100dvh !important;
    }

    a-scene,
    .a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100dvw !important;
      height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      overflow: hidden !important;
    }

    canvas,
    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100dvw !important;
      height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
    }

    video {
      position: fixed !important;
      inset: 0 !important;
      width: 100dvw !important;
      height: 100dvh !important;
      min-width: 100dvw !important;
      min-height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: cover !important;
      object-position: center center !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 99999;

      padding: 9px 16px;
      border-radius: 999px;

      background: rgba(0, 0, 0, 0.55);
      color: white;

      font-family: Arial, sans-serif;
      font-size: 13px;

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      opacity: 0;
      transition: opacity 0.4s ease;

      pointer-events: none;
      white-space: nowrap;
    }
  </style>

  <script>
    AFRAME.registerComponent("rolling-experience", {

      init: function () {

        const target = this.el;
        const entrance = document.querySelector("#entrance");
        const floating = document.querySelector("#floating");
        const tongue = document.querySelector("#tongueLayer");
        const hint = document.querySelector("#hint");

        let hintTimer;

        function resetAnimations() {

          entrance.removeAttribute("animation__scale");
          entrance.removeAttribute("animation__forward");
          entrance.removeAttribute("animation__rotate");

          floating.removeAttribute("animation__float");

          tongue.removeAttribute("animation__touch");
          tongue.removeAttribute("animation__touchback");

          entrance.setAttribute("scale", "0.18 0.18 0.18");
          entrance.setAttribute("position", "-0.08 0.02 0");
          entrance.setAttribute("rotation", "0 0 -7");

          floating.setAttribute("position", "0 0 0");

          tongue.setAttribute("position", "0 -0.01 0.065");
          tongue.setAttribute("scale", "1 1 1");
        }


        target.addEventListener("targetFound", () => {

          clearTimeout(hintTimer);
          resetAnimations();

          /*
            1. ENTRADA:
            empieza pequeño y crece.
          */

          entrance.setAttribute("animation__scale", {
            property: "scale",
            from: "0.18 0.18 0.18",
            to: "0.64 0.64 0.64",
            dur: 900,
            easing: "easeOutBack"
          });


          /*
            2. SALE HACIA DELANTE.
            Mucho más controlado que la versión anterior.
          */

          entrance.setAttribute("animation__forward", {
            property: "position",
            from: "-0.08 0.02 0",
            to: "-0.08 0.02 0.10",
            dur: 950,
            easing: "easeOutCubic"
          });


          /*
            3. PEQUEÑA INCLINACIÓN.
          */

          entrance.setAttribute("animation__rotate", {
            property: "rotation",
            from: "0 0 -7",
            to: "0 0 0",
            dur: 1050,
            easing: "easeOutBack"
          });


          /*
            4. DESPUÉS DE LA ENTRADA,
            comienza una flotación MUY suave.
          */

          setTimeout(() => {

            floating.setAttribute("animation__float", {
              property: "position",
              from: "0 -0.008 0",
              to: "0 0.012 0.018",
              dur: 1800,
              dir: "alternate",
              loop: true,
              easing: "easeInOutSine"
            });

          }, 1050);


          /*
            Indicamos que puede tocar el logo.
          */

          hintTimer = setTimeout(() => {
            hint.style.opacity = "1";
          }, 1200);

          hintTimer = setTimeout(() => {
            hint.style.opacity = "0";
          }, 4000);

        });


        target.addEventListener("targetLost", () => {

          clearTimeout(hintTimer);

          hint.style.opacity = "0";

          resetAnimations();

        });


        /*
          INTERACCIÓN:
          al tocar la lengua se acerca y vuelve.
        */

        tongue.addEventListener("click", () => {

          tongue.removeAttribute("animation__touch");
          tongue.removeAttribute("animation__touchback");

          tongue.setAttribute("animation__touch", {
            property: "scale",
            from: "1 1 1",
            to: "1.16 1.16 1.16",
            dur: 180,
            easing: "easeOutCubic"
          });

          setTimeout(() => {

            tongue.setAttribute("animation__touchback", {
              property: "scale",
              from: "1.16 1.16 1.16",
              to: "1 1 1",
              dur: 300,
              easing: "easeOutBack"
            });

          }, 180);

        });

      }

    });
  </script>

</head>


<body>

  <div id="hint">
    Tocá el logo
  </div>


  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiScanning: yes;
      uiLoading: yes;
      uiError: yes;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true;
      antialias: true;
    "

    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"

    cursor="rayOrigin: mouse"

    raycaster="
      objects: .clickable;
      far: 100;
    "

    embedded
  >


    <a-assets>

      <img id="boca" src="./boca.png">
      <img id="borde" src="./borde.png">
      <img id="dientes" src="./dientes.png">
      <img id="labios" src="./labios.png">
      <img id="lengua" src="./LENGUA.png">

    </a-assets>


    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    >
    </a-camera>


    <a-entity
      mindar-image-target="targetIndex: 0"
      rolling-experience
    >


      <!--
        ENTRANCE:
        mueve TODO el logo como una sola pieza.
      -->

      <a-entity
        id="entrance"
        position="-0.08 0.02 0"
        rotation="0 0 -7"
        scale="0.18 0.18 0.18"
      >


        <!--
          FLOATING:
          una vez terminada la entrada,
          todo el conjunto flota suavemente.
        -->

        <a-entity id="floating">


          <!-- BOCA -->

          <a-image
            src="#boca"
            position="0 0 0"
            width="1"
            height="1"

            material="
              transparent: true;
              alphaTest: 0.01;
              side: double;
            "
          >
          </a-image>


          <!-- BORDE -->

          <a-image
            src="#borde"
            position="0 0 0.008"
            width="1"
            height="1"

            material="
              transparent: true;
              alphaTest: 0.01;
              side: double;
            "
          >
          </a-image>


          <!-- DIENTES -->

          <a-image
            src="#dientes"
            position="0 0 0.016"
            width="1"
            height="1"

            material="
              transparent: true;
              alphaTest: 0.01;
              side: double;
            "
          >
          </a-image>


          <!-- LABIOS -->

          <a-image
            src="#labios"
            position="0 0 0.026"
            width="1"
            height="1"

            material="
              transparent: true;
              alphaTest: 0.01;
              side: double;
            "
          >
          </a-image>


          <!--
            LENGUA:
            sobresale solamente un poco.
            Ya no queda separada del resto.
          -->

          <a-image
            id="tongueLayer"
            class="clickable"

            src="#lengua"

            position="0 -0.01 0.065"

            width="1"
            height="1"

            material="
              transparent: true;
              alphaTest: 0.01;
              side: double;
            "
          >
          </a-image>


        </a-entity>

      </a-entity>


    </a-entity>


  </a-scene>


</body>
</html>
